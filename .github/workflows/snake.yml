name: Generate Snake and Activity Graph
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare output folder
        run: mkdir -p dist && chmod 777 dist

      - uses: Platane/snk@v3
        with:
          github_user_name: uday-3107
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23764ba2&color_dots=%2321262d,%23667eea,%237c8ff0,%23a5b4f5,%23c9d3fa&color_outline=%23444444
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23764ba2&color_dots=%2321262d,%23667eea,%237c8ff0,%23a5b4f5,%23c9d3fa&color_outline=%23444444

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: uday-3107
          options: theme=tokyo-night&hide_border=true&area=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats SVG
        id: stats
        continue-on-error: true
        run: curl -sf --retry 3 --retry-delay 5 "https://github-readme-stats.vercel.app/api?username=uday-3107&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&show=prs_merged,prs_merged_percentage" -o dist/github-stats.svg

      - name: Generate top-langs SVG
        id: toplangs
        continue-on-error: true
        run: curl -sf --retry 3 --retry-delay 5 "https://github-readme-stats.vercel.app/api/top-langs/?username=uday-3107&layout=compact&theme=tokyonight&hide_border=true" -o dist/top-langs.svg

      - name: Fall back to last known-good SVGs if fetch failed
        if: steps.stats.outcome == 'failure' || steps.toplangs.outcome == 'failure'
        run: |
          [ -s dist/github-stats.svg ] || curl -sf "https://raw.githubusercontent.com/uday-3107/uday-3107/output/github-stats.svg" -o dist/github-stats.svg || true
          [ -s dist/top-langs.svg ] || curl -sf "https://raw.githubusercontent.com/uday-3107/uday-3107/output/top-langs.svg" -o dist/top-langs.svg || true

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
