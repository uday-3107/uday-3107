name: Generate Snake and Activity Graph
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare output folder
        run: mkdir -p dist && chmod 777 dist

      - uses: Platane/snk@v3
        with:
          github_user_name: uday-3107
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23764ba2&color_dots=%2321262d,%23667eea,%237c8ff0,%23a5b4f5,%23c9d3fa&color_outline=%23444444
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23764ba2&color_dots=%2321262d,%23667eea,%237c8ff0,%23a5b4f5,%23c9d3fa&color_outline=%23444444

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: uday-3107
          options: theme=tokyo-night&hide_border=true&area=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=uday-3107&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&show=prs_merged,prs_merged_percentage
          path: dist/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top-langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=uday-3107&layout=compact&theme=tokyonight&hide_border=true
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
